{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    alb.ingress.kubernetes.io/group.name: peersyst-privatenet-alb
    alb.ingress.kubernetes.io/load-balancer-name: peersyst-privatenet-alb
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificate }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '443'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    {{- if .Values.relayer.enabled }}
    alb.ingress.kubernetes.io/actions.api-{{ .Values.environment }}: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"relayer-{{ .Values.environment }}","servicePort":"api","weight":20}]}}
    {{- end }}
    {{- if .Values.customIssuerGo.enabled }}
    alb.ingress.kubernetes.io/actions.custom-issuer-go-{{ .Values.environment }}: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"custom-issuer-go-{{ .Values.environment }}","servicePort":"api","weight":20}]}}
    {{- end }}
    {{- if .Values.landing.enabled }}
    alb.ingress.kubernetes.io/actions.landing-{{ .Values.environment }}: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"landing-{{ .Values.environment }}","servicePort":"api","weight":20}]}}
    {{- end }}
    {{- if .Values.console.enabled }}
    alb.ingress.kubernetes.io/actions.console-{{ .Values.environment }}: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"console-{{ .Values.environment }}","servicePort":"api","weight":20}]}}
    # The console API serves its Prometheus metrics under its own prefix, which
    # the rule below would otherwise publish with the rest of the API. Prometheus
    # scrapes the pod directly, so the public host answers 403 instead.
    alb.ingress.kubernetes.io/actions.console-metrics-{{ .Values.environment }}: >
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"403","messageBody":"Forbidden"}}
    {{- end }}
    {{- if .Values.consoleWeb.enabled }}
    alb.ingress.kubernetes.io/actions.console-web-{{ .Values.environment }}: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"console-web-{{ .Values.environment }}","servicePort":"web","weight":20}]}}
    {{- end }}
    {{- if .Values.sandboxBroker.enabled }}
    alb.ingress.kubernetes.io/actions.sandbox-broker-{{ .Values.environment }}: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"sandbox-broker-{{ .Values.environment }}","servicePort":"api","weight":20}]}}
    {{- end }}
  name: {{ .Values.namespace }}-{{ .Values.environment }}
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: alb
  rules:
    # Only when something still answers on it: a host whose every component is
    # off would render an empty paths list, which the API server rejects.
    {{- if or .Values.relayer.enabled .Values.customIssuerGo.enabled .Values.landing.enabled }}
    - host: fast-auth-{{ .Values.environment }}.aws.peersyst.tech
      http:
        paths:
          {{- if .Values.relayer.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-{{ .Values.environment }}
                port:
                  name: use-annotation
          {{- end }}
          {{- if .Values.customIssuerGo.enabled }}
          - path: /issuer
            pathType: Prefix
            backend:
              service:
                name: custom-issuer-go-{{ .Values.environment }}
                port:
                  name: use-annotation
          {{- end }}
          {{- if .Values.landing.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing-{{ .Values.environment }}
                port:
                  name: use-annotation
          {{- end }}
    {{- end }}
    {{- if .Values.landing.enabled }}
    - host: auth.near.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing-{{ .Values.environment }}
                port:
                  name: use-annotation
    {{- end }}
    {{- if or .Values.console.enabled .Values.consoleWeb.enabled }}
    # The console web app and its API share every host they answer on: the app
    # calls /api/console on its own origin, so the bundle needs no backend URL
    # and the API needs no cross-origin allowance. /api/console is listed before
    # /, since the ALB matches the most specific rule.
    {{- range $host := .Values.console.hosts }}
    - host: {{ $host }}
      http:
        paths:
          {{- if $.Values.console.enabled }}
          - path: /api/console/metrics
            pathType: Exact
            backend:
              service:
                name: console-metrics-{{ $.Values.environment }}
                port:
                  name: use-annotation
          - path: /api/console
            pathType: Prefix
            backend:
              service:
                name: console-{{ $.Values.environment }}
                port:
                  name: use-annotation
          {{- end }}
          {{- if $.Values.consoleWeb.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: console-web-{{ $.Values.environment }}
                port:
                  name: use-annotation
          {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.sandboxBroker.enabled }}
    {{- range $host := .Values.sandboxBroker.hosts }}
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandbox-broker-{{ $.Values.environment }}
                port:
                  name: use-annotation
    {{- end }}
    {{- end }}
{{- end }}
