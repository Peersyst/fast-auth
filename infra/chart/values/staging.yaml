environment: staging
namespace: fast-auth

relayer:
    enabled: true
    service:
        port: 3000
        targetPort: 3000
    deployment:
        name: relayer
        replicas: 1
        port: 3000
        memoryRequest: 256Mi
        cpuRequest: 100m
        memoryLimit: 256Mi
        cpuLimit: 100m
    secretProviderClass:
        objectName: "fast-auth/staging/relayer"
        objectAlias: fast-auth-staging-relayer
        secrets:
            appPort: APP_PORT
            nearPrivateKeys: NEAR_PRIVATE_KEYS
            nearRpcUrls: NEAR_RPC_URLS
            nearFastAuthContractId: NEAR_FAST_AUTH_CONTRACT_ID
            nearMpcContractId: NEAR_MPC_CONTRACT_ID
            nearAccountContractId: NEAR_ACCOUNT_CONTRACT_ID
            nearGuardId: NEAR_GUARD_ID
            nearIssuer: NEAR_ISSUER

# Retired with the Sweat testnet integration, the only thing that signed through
# them. custom-issuer-go signs with the KMS keys in infra/terraform, so it comes
# out of the cluster before that stack is destroyed.
customIssuer:
    enabled: false
    service:
        port: 3000
        targetPort: 3000
    deployment:
        name: custom-issuer
        replicas: 1
        port: 3000
        memoryRequest: 256Mi
        cpuRequest: 100m
        memoryLimit: 256Mi
        cpuLimit: 100m
    secretProviderClass:
        objectName: "fast-auth/staging/custom-issuer"
        objectAlias: fast-auth-staging-custom-issuer
        secrets:
            keyBase64: KEY_BASE64
            validationPublicKeyUrl: VALIDATION_PUBLIC_KEY_URL
            validationIssuerUrl: VALIDATION_ISSUER_URL
            issuerUrl: ISSUER_URL
            allowedOrigins: ALLOWED_ORIGINS
            ignoreExpiration: IGNORE_EXPIRATION

customIssuerGo:
    enabled: false
    service:
        port: 3000
        targetPort: 3000
    deployment:
        name: custom-issuer-go
        replicas: 1
        port: 3000
        memoryRequest: 256Mi
        cpuRequest: 100m
        memoryLimit: 256Mi
        cpuLimit: 100m
    secretProviderClass:
        objectName: "fast-auth/staging/custom-issuer-go"
        objectAlias: fast-auth-staging-custom-issuer-go
        secrets:
            validationPublicKeyUrl: VALIDATION_PUBLIC_KEY_URL
            validationIssuerUrl: VALIDATION_ISSUER_URL
            issuerUrl: ISSUER_URL
            allowedOrigins: ALLOWED_ORIGINS
            ignoreExpiration: IGNORE_EXPIRATION
            kmsRegion: KMS_REGION
            kmsKeyId: KMS_KEY_ID

attester:
    enabled: false
    replicas: 2
    cronjob:
        name: attester
        memoryRequest: 256Mi
        cpuRequest: 100m
        memoryLimit: 256Mi
        cpuLimit: 100m
    secretProviderClass:
        objectName: "fast-auth/staging/attester"
        objectAlias: fast-auth-staging-attester
        secrets:
            nodeUrl: NODE_URL
            contractId: CONTRACT_ID
            guardContractId: GUARD_CONTRACT_ID
            accountId: ACCOUNT_ID
            privateKey: PRIVATE_KEY
            keyProvider: KEY_PROVIDER
            kmsRegion: KMS_REGION
            kmsPreviousKeyId: KMS_PREVIOUS_KEY_ID
            kmsCurrentKeyId: KMS_CURRENT_KEY_ID
            kmsNextKeyId: KMS_NEXT_KEY_ID

landing:
    enabled: true
    metricsUrl: "https://fast-auth-indexer-api-api-production.up.railway.app/api/public/metrics"
    service:
        port: 3000
        targetPort: 3000
    deployment:
        name: landing
        replicas: 1
        port: 3000
        memoryRequest: 256Mi
        cpuRequest: 100m
        memoryLimit: 256Mi
        cpuLimit: 100m

# Off until fast-auth/staging/console holds its value: without the secret the
# CSI driver never mounts, the pod never turns ready and the whole release rolls
# back, taking the rest of staging with it. Flip both to true once it is filled.
console:
    enabled: true
    # The web app and the API share these hosts: the API answers under
    # /api/console and every other path is the bundle, so the app calls its API
    # on its own origin and nothing crosses an origin.
    hosts:
        - console-staging.aws.peersyst.tech
    service:
        port: 3000
        targetPort: 3000
    deployment:
        name: console
        # One pod: the API runs the database migrations on startup.
        replicas: 1
        port: 3000
        memoryRequest: 256Mi
        cpuRequest: 100m
        memoryLimit: 512Mi
        cpuLimit: 500m
    # Settings that are not secret, kept here so a change is reviewed with the
    # deployment. Everything under secretProviderClass lives in Secrets Manager.
    env:
        PUBLIC_URL: "https://console-staging.aws.peersyst.tech"
        AUTH0_PROVISIONER: management
        AUTO_APPROVAL_ENABLED: "false"
        DB_PORT: "5432"
        # Verifies the server against Node's built-in CAs, which cover RDS.
        DB_SSL: "true"
    secretProviderClass:
        objectName: "fast-auth/staging/console"
        objectAlias: fast-auth-staging-console
        secrets:
            auth0LoginDomain: AUTH0_LOGIN_DOMAIN
            auth0ConsoleClientId: AUTH0_CONSOLE_CLIENT_ID
            auth0MgmtDomain: AUTH0_MGMT_DOMAIN
            auth0M2mClientId: AUTH0_M2M_CLIENT_ID
            auth0M2mClientSecret: AUTH0_M2M_CLIENT_SECRET
            auth0TemplateClientId: AUTH0_TEMPLATE_CLIENT_ID
            dbHost: DB_HOST
            dbDatabase: DB_DATABASE
            dbUser: DB_USER
            dbPassword: DB_PASSWORD
            adminEmails: ADMIN_EMAILS
            slackWebhookUrl: SLACK_WEBHOOK_URL

consoleWeb:
    enabled: true
    service:
        port: 80
        targetPort: 80
    deployment:
        name: console-web
        replicas: 1
        port: 80
        memoryRequest: 64Mi
        cpuRequest: 50m
        memoryLimit: 128Mi
        cpuLimit: 100m

ingress:
    enabled: true
    certificate: "arn:aws:acm:us-east-1:291847425310:certificate/b183b365-4363-4245-9966-7e990bf7b3d4,arn:aws:acm:us-east-1:291847425310:certificate/98ea271d-f264-4788-b668-db3f52f8e2c5"
