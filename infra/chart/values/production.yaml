environment: production
namespace: fast-auth

relayer:
    enabled: true
    service:
        port: 3000
        targetPort: 3000
    deployment:
        name: relayer
        replicas: 1
        port: 3000
        memoryRequest: 256Mi
        cpuRequest: 100m
        memoryLimit: 256Mi
        cpuLimit: 100m
    secretProviderClass:
        objectName: "fast-auth/prod/relayer"
        objectAlias: fast-auth-prod-relayer
        secrets:
            appPort: APP_PORT
            nearPrivateKeys: NEAR_PRIVATE_KEYS
            nearRpcUrls: NEAR_RPC_URLS
            nearFastAuthContractId: NEAR_FAST_AUTH_CONTRACT_ID
            nearMpcContractId: NEAR_MPC_CONTRACT_ID
            nearAccountContractId: NEAR_ACCOUNT_CONTRACT_ID
            nearGuardId: NEAR_GUARD_ID
            nearIssuer: NEAR_ISSUER

# Not deployed in production. The chart's ingress and templates read these
# flags, so the keys have to exist even when the component is off.
customIssuer:
    enabled: false

customIssuerGo:
    enabled: false

attester:
    enabled: false

landing:
    enabled: true
    metricsUrl: "https://fast-auth-indexer-api-api-production.up.railway.app/api/public/metrics"
    service:
        port: 3000
        targetPort: 3000
    deployment:
        name: landing
        replicas: 1
        port: 3000
        memoryRequest: 256Mi
        cpuRequest: 100m
        memoryLimit: 256Mi
        cpuLimit: 100m

console:
    enabled: true
    # The web app and the API share these hosts: the API answers under
    # /api/console and every other path is the bundle, so the app calls its API
    # on its own origin and nothing crosses an origin.
    #
    # The public host needs a record in the near.org zone and an ACM certificate
    # that covers it, neither of which exists yet; the aws.peersyst.tech one is
    # reachable today, so production can be deployed and checked meanwhile.
    # Drop it once the public host answers.
    hosts:
        - console.auth.near.org
        - console-production.aws.peersyst.tech
    service:
        port: 3000
        targetPort: 3000
    deployment:
        name: console
        # One pod: the API runs the database migrations on startup.
        replicas: 1
        port: 3000
        memoryRequest: 256Mi
        cpuRequest: 100m
        memoryLimit: 512Mi
        cpuLimit: 500m
    # Settings that are not secret, kept here so a change is reviewed with the
    # deployment. Everything under secretProviderClass lives in Secrets Manager.
    env:
        PUBLIC_URL: "https://console.auth.near.org"
        AUTH0_PROVISIONER: management
        AUTO_APPROVAL_ENABLED: "false"
        DB_PORT: "5432"
        # Verifies the server against Node's built-in CAs, which cover RDS.
        DB_SSL: "true"
    secretProviderClass:
        objectName: "fast-auth/prod/console"
        objectAlias: fast-auth-prod-console
        secrets:
            auth0LoginDomain: AUTH0_LOGIN_DOMAIN
            auth0ConsoleClientId: AUTH0_CONSOLE_CLIENT_ID
            auth0MgmtDomain: AUTH0_MGMT_DOMAIN
            auth0M2mClientId: AUTH0_M2M_CLIENT_ID
            auth0M2mClientSecret: AUTH0_M2M_CLIENT_SECRET
            auth0TemplateClientId: AUTH0_TEMPLATE_CLIENT_ID
            dbHost: DB_HOST
            dbDatabase: DB_DATABASE
            dbUser: DB_USER
            dbPassword: DB_PASSWORD
            adminEmails: ADMIN_EMAILS
            slackWebhookUrl: SLACK_WEBHOOK_URL

consoleWeb:
    enabled: true
    service:
        port: 80
        targetPort: 80
    deployment:
        name: console-web
        replicas: 1
        port: 80
        memoryRequest: 64Mi
        cpuRequest: 50m
        memoryLimit: 128Mi
        cpuLimit: 100m

ingress:
    enabled: true
    certificate: "arn:aws:acm:us-east-1:291847425310:certificate/b183b365-4363-4245-9966-7e990bf7b3d4,arn:aws:acm:us-east-1:291847425310:certificate/3446ab94-39e4-4efe-8b54-e09e15ede9d2"
