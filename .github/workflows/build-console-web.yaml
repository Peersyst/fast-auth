name: "Build console web image"

on:
  workflow_call:
    inputs:
      push:
        required: true
        type: boolean
      target:
        required: true
        type: string
      base_image:
        required: true
        type: string
      environment:
        description: "Environment whose settings are baked into the bundle"
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Vite bakes the settings into the bundle, so each environment gets its own
    # image and reads its own GitHub environment variables. A build that is not
    # pushed only checks that the app compiles, so it takes no environment and
    # none of its variables.
    environment: ${{ inputs.push && inputs.environment || '' }}
    steps:
      # Checkout repository under $GITHUB_WORKSPACE path
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Configure tag name. The tag carries the environment, since the same
      # commit produces one image per environment.
      - name: Sets env vars
        run: |
          echo "DOCKER_IMAGE_NAME=ghcr.io/peersyst/${{ github.event.repository.name }}-console-web:${GITHUB_SHA:0:8}-${{ inputs.environment }}" >> $GITHUB_ENV

      # Build docker image
      - name: Build docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/console-web.Dockerfile
          target: ${{ inputs.target }}
          push: ${{ inputs.push }}
          tags: ${{ env.DOCKER_IMAGE_NAME }}
          build-args: |
            BASE_IMAGE=ghcr.io/peersyst/${{ github.event.repository.name }}-base:${{ inputs.base_image }}
            TURBO_TEAM=peersyst
            BACKEND_URL=${{ vars.CONSOLE_WEB_BACKEND_URL }}
            AUTH0_LOGIN_DOMAIN=${{ vars.CONSOLE_WEB_AUTH0_LOGIN_DOMAIN }}
            AUTH0_CLIENT_ID=${{ vars.CONSOLE_WEB_AUTH0_CLIENT_ID }}
            NEAR_NETWORK=${{ vars.CONSOLE_WEB_NEAR_NETWORK }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
