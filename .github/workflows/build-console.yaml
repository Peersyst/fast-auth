name: "Build console image"

on:
  workflow_call:
    inputs:
      push:
        required: true
        type: boolean
      target:
        required: true
        type: string
      base_image:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sets env vars
        run: |
          echo "DOCKER_IMAGE_NAME=ghcr.io/peersyst/${{ github.event.repository.name }}-console:${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Build docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/console.Dockerfile
          target: ${{ inputs.target }}
          push: ${{ inputs.push }}
          tags: ${{ env.DOCKER_IMAGE_NAME }}
          build-args: |
            BASE_IMAGE=ghcr.io/peersyst/${{ github.event.repository.name }}-base:${{ inputs.base_image }}
            TURBO_TEAM=peersyst
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
