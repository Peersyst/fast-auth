name: "Build and deploy"

on:
    push:
        branches:
            - main

concurrency:
    # Cancel old runs if there is a new commit in the same branch
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    build-base:
        uses: ./.github/workflows/build-base.yaml
        secrets: inherit
        with:
            push: true
            tag: ${{ github.sha }}

    build-relayer:
        needs: [build-base]
        uses: ./.github/workflows/build-relayer.yaml
        secrets: inherit
        with:
          push: true
          target: release
          base_image: ${{ github.sha }}

    build-attester:
        needs: [build-base]
        uses: ./.github/workflows/build-attester.yaml
        secrets: inherit
        with:
          push: true
          target: release
          base_image: ${{ github.sha }}

    build-custom-issuer:
        needs: [build-base]
        uses: ./.github/workflows/build-custom-issuer.yaml
        secrets: inherit
        with:
          push: true
          target: release
          base_image: ${{ github.sha }}

    build-custom-issuer-go:
        needs: [build-base]
        uses: ./.github/workflows/build-custom-issuer-go.yaml
        secrets: inherit
        with:
          push: true
          target: release
          base_image: ${{ github.sha }}

    build-landing:
        needs: [build-base]
        uses: ./.github/workflows/build-landing.yaml
        secrets: inherit
        with:
          push: true
          target: release
          base_image: ${{ github.sha }}

    build-console:
        needs: [build-base]
        uses: ./.github/workflows/build-console.yaml
        secrets: inherit
        with:
          push: true
          target: release
          base_image: ${{ github.sha }}

    # Two images out of the same commit: Vite bakes each environment's settings
    # into its own bundle, so staging and production cannot share one.
    build-console-web-staging:
        needs: [build-base]
        uses: ./.github/workflows/build-console-web.yaml
        secrets: inherit
        with:
          push: true
          target: release
          base_image: ${{ github.sha }}
          environment: staging

    build-console-web-production:
        needs: [build-base]
        uses: ./.github/workflows/build-console-web.yaml
        secrets: inherit
        with:
          push: true
          target: release
          base_image: ${{ github.sha }}
          environment: production

    deploy:
        needs: [build-relayer, build-attester, build-custom-issuer, build-custom-issuer-go, build-landing, build-console, build-console-web-staging]
        uses: ./.github/workflows/deploy.yaml
        secrets: inherit
        with:
          environment: 'staging'
